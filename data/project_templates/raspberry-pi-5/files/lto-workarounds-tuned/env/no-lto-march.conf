# Cortex-A76 flags as -march/-mtune instead of -mcpu, without LTO. Packages compiling some files with their own
# -march (eg. spidermonkey with +i8mm) conflict with -mcpu, and with -flto inlining of NEON intrinsics fails then
# ("target specific option mismatch").
COMMON_FLAGS="-O2 -pipe -march=armv8.2-a+crc+crypto+dotprod+fp16+rcpc -mtune=cortex-a76"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O1 -Wl,--as-needed"
