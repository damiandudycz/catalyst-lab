format = 1
min_app_version = "2.0.0"
# Build identities and stage graphs are generated independently for each selected init system.
stage_id_suffix = "{{ init }}"
name = "Raspberry Pi 5"
description = "Gentoo for Raspberry Pi 5: CPU target selection, boot configuration, zram swap and optional GNOME and KDE Plasma desktops."
groups_title = "Software"
architecture = "arm64"

[[variables]]
id = "init_systems"
title = "Init systems"
description = "Choose one or both. OpenRC services are enabled automatically."
type = "multiple"
minimum_selected = 1
default = ["openrc"]
options = [
    { value = "openrc", title = "OpenRC" },
    { value = "systemd", title = "systemd" },
]

[[variables]]
id = "optimization"
title = "CPU target"
default = "tuned"
options = [
    { value = "tuned", title = "ARM Cortex-A76 (cortex-a76)" },
    { value = "generic", title = "Generic baseline" },
]

[[variables]]
id = "overclock"
title = "CPU frequency"
description = "Overclocking needs Active Cooler or other good cooling."
default = "stock"
options = [
    { value = "stock", title = "2.4 GHz (stock)" },
    { value = "2600", title = "2.6 GHz" },
    { value = "2800", title = "2.8 GHz" },
]

[[variables]]
id = "serial_console"
title = "Serial console"
description = "Console on UART pins and debug connector, useful for headless setup."
type = "boolean"
default = true

[[variables]]
id = "lto"
title = "Link-time optimization (LTO)"
description = "Programs can be faster and smaller, but builds take longer and some packages may fail to build."
type = "boolean"
default = false

[[variables]]
id = "accept_all_licenses"
title = "Accept all licenses"
description = "Required to enable stage4 builds (console, GNOME or KDE Plasma) because the Raspberry Pi kernel uses a restricted license. Allows Portage to install packages with any license in those selected stage4 builds. Does not affect stage3 or ISO builds."
type = "boolean"
default = false

[[variables]]
id = "extra_stages"
title = "Extra stages"
section = "Extra stages"
description = "Select the console stage4, GNOME or KDE Plasma stage4 builds, optional customized GNOME stage4, or experimental ISO stages. Raspberry Pi firmware doesn't boot ISO images directly, so the ISO stages are intended for testing."
type = "multiple"
default = []
options = [
    { value = "stage4", title = "Console stage4", when = "accept_all_licenses" },
    { value = "gnome", title = "GNOME stage4", when = "accept_all_licenses" },
    { value = "gnome_customized", title = "Customized GNOME stage4", when = "accept_all_licenses and 'gnome' in extra_stages" },
    { value = "plasma", title = "KDE Plasma stage4", when = "accept_all_licenses" },
    { value = "iso", title = "Installation ISO", when = "'openrc' in init_systems" },
    { value = "iso_gui", title = "Live ISO with desktop", when = "'openrc' in init_systems" },
]

[[variables]]
id = "zram"
title = "zram swap"
description = "Compressed swap in memory."
default = "2048"
options = [
    { value = "off", title = "Disabled" },
    { value = "1024", title = "1 GB" },
    { value = "2048", title = "2 GB" },
    { value = "4096", title = "4 GB" },
]

[values]
openrc = "{{ init == 'openrc' }}"
systemd = "{{ init == 'systemd' }}"
tuned = "{{ optimization == 'tuned' }}"
cpu_flags = "{{ '-O2 -pipe -mcpu=cortex-a76+crc+crypto -mtune=cortex-a76' if tuned else '-O2 -pipe' }}"
# Release type names optimizations (eg. 23.0-cortex-a76-lto), generic stages use 23.0-default of releng specs.
optimizations = "{{ (['cortex-a76'] if tuned else []) + (['lto'] if lto else []) }}"
rel_type = "{{ '23.0-' + join('-', optimizations) if optimizations else '' }}"
common_flags = "{{ cpu_flags + (' -flto -Werror=odr -Werror=lto-type-mismatch -Werror=strict-aliasing' if lto else '') if tuned or lto else None }}"
hostname = "{{ replace(lower(project_name), ' ', '-') or 'raspberrypi' }}"
stage1_name = "stage1-{{ init }}"
stage4_name = "stage4-{{ init }}"
gnome_customizations = "{{ 'gnome_customized' in extra_stages }}"
with_desktop = "{{ accept_all_licenses and ('gnome' in extra_stages or 'plasma' in extra_stages) }}"
desktop_stage3_name = "stage3-desktop-{{ init }}"
iso_stage1_name = "livecd-stage1-{{ init }}"
iso_stage2_name = "livecd-stage2-{{ init }}"
# Installation tools of minimal installation ISO of Gentoo releases.
iso_packages = "{{ ['app-portage/gentoolkit', 'net-misc/chrony', 'net-misc/networkmanager', 'app-accessibility/brltty', 'app-admin/pwgen', 'app-arch/lbzip2', 'app-arch/pigz', 'app-arch/zstd', 'app-crypt/gnupg', 'app-misc/livecd-tools', 'app-portage/mirrorselect', 'app-shells/bash-completion', 'app-shells/gentoo-bashcomp', 'net-analyzer/traceroute', 'net-misc/dhcpcd', 'net-misc/iputils', 'net-misc/openssh', 'net-misc/rdate', 'net-wireless/iw', 'net-wireless/iwd', 'net-wireless/wireless-tools', 'net-wireless/wpa_supplicant', 'sys-apps/busybox', 'sys-apps/ethtool', 'sys-apps/gptfdisk', 'sys-apps/hdparm', 'sys-apps/iproute2', 'sys-apps/memtester', 'sys-apps/sdparm', 'sys-apps/usbutils', 'sys-auth/ssh-import-id', 'sys-block/parted', 'sys-fs/btrfs-progs', 'sys-fs/cryptsetup', 'sys-fs/dosfstools', 'sys-fs/e2fsprogs', 'sys-fs/f2fs-tools', 'sys-fs/lsscsi', 'sys-fs/sysfsutils', 'sys-fs/xfsprogs', 'sys-libs/gpm', 'sys-process/lsof', 'www-client/links'] + ([] if zram == 'off' else ['sys-block/zram-init']) }}"
# arm64 installcd-stage1 package set, maintained here so this Pi image does not
# inherit linux-firmware (the wireless group supplies Raspberry Pi firmware).
iso_base_packages = [
    "app-accessibility/brltty", "app-accessibility/espeakup", "app-admin/hddtemp",
    "app-admin/pwgen", "app-admin/syslog-ng", "app-arch/unzip", "app-crypt/gnupg",
    "app-editors/mg", "app-editors/nano", "app-misc/livecd-tools", "app-misc/screen",
    "app-misc/tmux", "app-portage/cpuid2cpuflags", "app-portage/gentoolkit",
    "app-portage/mirrorselect", "app-shells/bash-completion", "app-shells/gentoo-bashcomp",
    "app-text/wgetpaste", "dev-embedded/u-boot-tools", "media-gfx/fbgrab",
    "media-sound/alsa-utils", "net-analyzer/traceroute", "net-dialup/mingetty",
    "net-dialup/pptpclient", "net-dialup/rp-pppoe", "net-fs/cifs-utils", "net-fs/nfs-utils",
    "net-irc/irssi", "net-misc/chrony", "net-misc/dhcpcd", "net-misc/iputils",
    "net-misc/ndisc6", "net-misc/openssh", "net-misc/rdate", "net-misc/rsync",
    "net-misc/vconfig", "net-proxy/dante", "net-wireless/b43-fwcutter", "net-wireless/iw",
    "net-wireless/wireless-tools", "net-wireless/wpa_supplicant", "sys-apps/arch-chroot",
    "sys-apps/busybox", "sys-apps/dmidecode", "sys-apps/ethtool", "sys-apps/fxload",
    "sys-apps/gptfdisk", "sys-apps/hdparm", "sys-apps/iproute2", "sys-apps/memtester",
    "sys-apps/merge-usr", "sys-apps/netplug", "sys-apps/nvme-cli", "sys-apps/pciutils",
    "sys-apps/pv", "sys-apps/pcmciautils", "sys-apps/sdparm", "sys-apps/usbutils",
    "sys-auth/ssh-import-id", "sys-block/parted", "sys-block/partimage",
    "sys-firmware/ipw2100-firmware", "sys-firmware/ipw2200-firmware", "sys-fs/bcache-tools",
    "sys-fs/btrfs-progs", "sys-fs/cryptsetup", "sys-fs/dmraid", "sys-fs/dosfstools",
    "sys-fs/e2fsprogs", "sys-fs/f2fs-tools", "sys-fs/genfstab", "sys-fs/jfsutils",
    "sys-fs/lsscsi", "sys-fs/lvm2", "sys-fs/mdadm", "sys-fs/multipath-tools",
    "sys-fs/ntfs3g", "sys-fs/reiserfsprogs", "sys-fs/xfsdump", "sys-fs/xfsprogs",
    "sys-libs/gpm", "sys-power/acpid", "www-client/links",
]
# Additional packages and settings for the Raspberry Pi installation ISO.
iso_extra_packages = "{{ ['net-misc/networkmanager', 'net-wireless/iwd', 'app-arch/lbzip2', 'app-arch/pigz', 'app-arch/zstd', 'sys-fs/sysfsutils', 'sys-process/lsof'] + ([] if zram == 'off' else ['sys-block/zram-init']) }}"
iso_services = "{{ ([] if zram == 'off' else ['zram-init|boot']) + ['NetworkManager|default', 'chronyd|default'] + (['bluetooth|default'] if 'wireless' in groups else []) }}"
livegui_stage1_name = "livegui-stage1-{{ init }}"
livegui_stage2_name = "livegui-stage2-{{ init }}"
# KDE Plasma with basic applications (Gentoo LiveGUI has many more, which take long to build) and installation tools.
livegui_packages = "{{ iso_packages + ['kde-plasma/plasma-meta', 'x11-misc/sddm', 'kde-apps/konsole', 'kde-apps/dolphin', 'kde-apps/kate', 'www-client/firefox-bin', 'sys-block/gparted', 'app-admin/sudo', 'app-editors/nano', 'app-misc/tmux', 'sys-apps/pciutils', 'sys-process/htop'] }}"
livegui_services = "{{ ([] if zram == 'off' else ['zram-init|boot']) + ['udev|sysinit', 'udev-mount|sysinit', 'elogind|boot', 'dbus|default', 'NetworkManager|default', 'display-manager|default'] + (['bluetooth|default'] if 'wireless' in groups else []) }}"
gnome_stage4_name = "stage4-gnome-{{ init }}"
gnome_extras_stage4_name = "stage4-gnome-customized-{{ init }}"
plasma_stage4_name = "stage4-plasma-{{ init }}"
desktop_profile_suffix = "{{ '/systemd' if init == 'systemd' else '' }}"
base_packages = "{{ ['app-admin/sudo', 'app-portage/gentoolkit', 'net-misc/networkmanager', 'net-misc/chrony', 'sys-power/cpupower', 'sys-kernel/raspberrypi-image'] + (['app-admin/sysklogd'] if openrc else []) + ([] if zram == 'off' else ['sys-block/zram-init']) }}"
base_services = "{{ (['cpupower|boot', 'dbus|default', 'NetworkManager|default', 'sysklogd|default', 'chronyd|default', 'sshd|default'] + ([] if zram == 'off' else ['zram-init|boot'])) if openrc else [] }}"

[[stages]]
id = "stage1"
name = "{{ stage1_name }}"
target = "stage1"
releng_template = "stage1-{{ init }}-23.spec"
[stages.arguments]
common_flags = "{{ common_flags }}"
catalyst_use = "{{ ['lto'] if lto else [] }}"
rel_type = "{{ rel_type }}"

[[stages]]
id = "stage3"
parent = "stage1"
name = "stage3-{{ init }}"
target = "stage3"
releng_template = "stage3-{{ init }}-23.spec"

[[stages]]
id = "stage4"
parent = "stage3"
name = "{{ stage4_name }}"
target = "stage4"
when = "accept_all_licenses and 'stage4' in extra_stages"
[stages.arguments]
stage4_use = ["networkmanager", "bluetooth"]
stage4_packages = "{{ base_packages }}"
stage4_rcadd = "{{ base_services }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_rm = ["/root/.bash_history"]

[[stages]]
id = "stage3-desktop"
parent = "stage1"
name = "{{ desktop_stage3_name }}"
target = "stage3"
releng_template = "stage3d-{{ init }}-23.spec"
when = "with_desktop or 'iso_gui' in extra_stages"

[[stages]]
id = "stage4-gnome"
parent = "stage3-desktop"
name = "{{ gnome_stage4_name }}"
target = "stage4"
when = "accept_all_licenses and 'gnome' in extra_stages"
[stages.arguments]
profile = { type = "PortageProfile", value = { path = "default/linux/arm64/23.0/desktop/gnome{{ desktop_profile_suffix }}", stability = "stable", repo = "gentoo" } }
version_stamp = "gnome-{{ init }}-@TIMESTAMP@"
stage4_use = ["networkmanager", "bluetooth", "pulseaudio"]
stage4_packages = "{{ base_packages + ['gnome-base/gnome', 'gnome-base/gdm'] }}"
stage4_rcadd = "{{ base_services + (['display-manager|default'] if openrc else []) }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_rm = ["/root/.bash_history"]

[[stages]]
id = "stage4-gnome-extras"
parent = "stage4-gnome"
name = "{{ gnome_extras_stage4_name }}"
target = "stage4"
when = "accept_all_licenses and 'gnome' in extra_stages and gnome_customizations"
[stages.arguments]
stage4_packages = ["sys-apps/flatpak", "net-misc/curl", "app-arch/unzip"]
version_stamp = "gnome-customized-{{ init }}-@TIMESTAMP@"
stage4_fsscript = "@STAGE_DIR@/install-gnome-extras.sh"

[[stages]]
id = "stage4-plasma"
parent = "stage3-desktop"
name = "{{ plasma_stage4_name }}"
target = "stage4"
when = "accept_all_licenses and 'plasma' in extra_stages"
[stages.arguments]
profile = { type = "PortageProfile", value = { path = "default/linux/arm64/23.0/desktop/plasma{{ desktop_profile_suffix }}", stability = "stable", repo = "gentoo" } }
version_stamp = "plasma-{{ init }}-@TIMESTAMP@"
stage4_use = ["networkmanager", "bluetooth", "pulseaudio"]
stage4_packages = "{{ base_packages + ['kde-plasma/plasma-meta', 'x11-misc/sddm'] + (['gui-libs/display-manager-init'] if openrc else []) }}"
stage4_rcadd = "{{ base_services + (['display-manager|default'] if openrc else []) }}"
stage4_empty = ["/var/cache/distfiles"]
stage4_fsscript = "@STAGE_DIR@/configure-plasma.sh"
stage4_rm = ["/root/.bash_history"]

# Installation ISO (experimental): retain the installcd spec configuration, with an explicit package set.
[[stages]]
id = "livecd-stage1"
parent = "stage3"
name = "{{ iso_stage1_name }}"
target = "livecd_stage1"
releng_template = "installcd-stage1.spec"
when = "'iso' in extra_stages"
[stages.arguments]
livecd_packages = "{{ iso_base_packages + iso_extra_packages }}"

[[stages]]
id = "livecd-stage2"
parent = "livecd-stage1"
name = "{{ iso_stage2_name }}"
target = "livecd_stage2"
releng_template = "installcd-stage2-minimal.spec"
when = "'iso' in extra_stages"
[stages.arguments]
livecd_volid = "Gentoo-rpi5"
livecd_iso = "install-rpi5-@TIMESTAMP@.iso"
livecd_rcadd = "{{ ['@releng'] + iso_services }}"
# Live ISO with desktop (experimental): KDE Plasma live system like Gentoo LiveGUI (releng livegui specs), from
# desktop stage3.
[[stages]]
id = "livegui-stage1"
parent = "stage3-desktop"
name = "{{ livegui_stage1_name }}"
target = "livecd_stage1"
when = "'iso_gui' in extra_stages"
[stages.arguments]
profile = { type = "PortageProfile", value = { path = "default/linux/arm64/23.0/desktop/plasma", stability = "stable", repo = "gentoo" } }
version_stamp = "plasma-@TIMESTAMP@"
livecd_use = ["accessibility", "compile-locales", "fbcon", "livecd", "networkmanager", "pulseaudio", "python"]
livecd_packages = "{{ livegui_packages }}"

[[stages]]
id = "livegui-stage2"
parent = "livegui-stage1"
name = "{{ livegui_stage2_name }}"
target = "livecd_stage2"
when = "'iso_gui' in extra_stages"
[stages.arguments]
livecd_type = "gentoo-release-livecd"
livecd_bootargs = "nodhcp"
livecd_depclean = "no"
livecd_fstype = "squashfs"
livecd_volid = "Gentoo-rpi5-livegui"
livecd_iso = "livegui-rpi5-@TIMESTAMP@.iso"
livecd_fsscript = "@STAGE_DIR@/fsscript.sh"
livecd_rcadd = "{{ livegui_services }}"
livecd_unmerge = ["net-misc/netifrc"]
livecd_empty = ["/var/db/repos", "/usr/src"]

# CPU features and GPU of Raspberry Pi 5, inherited by all stages (parent overlay).
[[files]]
source = "files/stage1"
destination = "stages/{{ stage1_name }}"

# Raspberry Pi boot configuration.
[[files]]
source = "files/stage4"
destination = "stages/{{ stage4_name }}"
when = "accept_all_licenses and 'stage4' in extra_stages"

[[files]]
source = "files/accept-all-licenses"
destination = "stages/{{ stage4_name }}/portage"
when = "accept_all_licenses and 'stage4' in extra_stages"

[[files]]
source = "files/zram"
destination = "stages/{{ stage4_name }}/root_overlay"
when = "'stage4' in extra_stages and zram != 'off'"

# Desktops: the same as console stage4, with display manager and build workarounds of large packages.
[[files]]
source = "files/stage4"
destination = "stages/{{ gnome_stage4_name }}"
when = "'gnome' in extra_stages"

[[files]]
source = "files/accept-all-licenses"
destination = "stages/{{ gnome_stage4_name }}/portage"
when = "accept_all_licenses and 'gnome' in extra_stages"

[[files]]
source = "files/zram"
destination = "stages/{{ gnome_stage4_name }}/root_overlay"
when = "zram != 'off' and 'gnome' in extra_stages"

[[files]]
source = "files/desktop"
destination = "stages/{{ gnome_stage4_name }}"
when = "'gnome' in extra_stages"

[[files]]
source = "files/desktop-gnome"
destination = "stages/{{ gnome_stage4_name }}"
when = "'gnome' in extra_stages and openrc"

[[files]]
source = "files/gnome-extras/install-gnome-extras.sh"
destination = "stages/{{ gnome_extras_stage4_name }}/install-gnome-extras.sh"
when = "'gnome' in extra_stages and gnome_customizations"

[[files]]
source = "files/gnome-extras/root_overlay"
destination = "stages/{{ gnome_extras_stage4_name }}/root_overlay"
when = "'gnome' in extra_stages and gnome_customizations"

[[files]]
source = "files/lto-workarounds"
destination = "stages/{{ gnome_stage4_name }}/portage"
when = "'gnome' in extra_stages and lto"

[[files]]
source = "files/lto-workarounds-tuned"
destination = "stages/{{ gnome_stage4_name }}/portage"
when = "'gnome' in extra_stages and lto and tuned"

[[files]]
source = "files/stage4"
destination = "stages/{{ plasma_stage4_name }}"
when = "'plasma' in extra_stages"

[[files]]
source = "files/accept-all-licenses"
destination = "stages/{{ plasma_stage4_name }}/portage"
when = "accept_all_licenses and 'plasma' in extra_stages"

[[files]]
source = "files/zram"
destination = "stages/{{ plasma_stage4_name }}/root_overlay"
when = "zram != 'off' and 'plasma' in extra_stages"

[[files]]
source = "files/desktop"
destination = "stages/{{ plasma_stage4_name }}"
when = "'plasma' in extra_stages"

[[files]]
source = "files/desktop-plasma"
destination = "stages/{{ plasma_stage4_name }}"
when = "'plasma' in extra_stages"

[[files]]
source = "files/openrc-display-manager/root_overlay"
destination = "stages/{{ plasma_stage4_name }}/root_overlay"
when = "'plasma' in extra_stages and openrc"

[[files]]
source = "files/lto-workarounds"
destination = "stages/{{ plasma_stage4_name }}/portage"
when = "'plasma' in extra_stages and lto"

[[files]]
source = "files/lto-workarounds-tuned"
destination = "stages/{{ plasma_stage4_name }}/portage"
when = "'plasma' in extra_stages and lto and tuned"

[[groups]]
id = "wireless"
title = "Wi-Fi and Bluetooth"
description = "Firmware of wireless chip and Bluetooth service."
default = true
when = "'stage4' in extra_stages or 'gnome' in extra_stages or 'plasma' in extra_stages or 'iso' in extra_stages or 'iso_gui' in extra_stages"
# Live CDs get firmware in stage1 (stage2 is built from it), their services add Bluetooth.
stages = ["stage4", "stage4-gnome", "stage4-plasma", "livecd-stage1", "livegui-stage1"]
[groups.arguments]
stage4_packages = ["sys-firmware/raspberrypi-wifi-ucode", "net-wireless/bluez"]
livecd_packages = ["sys-firmware/raspberrypi-wifi-ucode", "net-wireless/bluez"]
stage4_rcadd = "{{ ['bluetooth|default'] if openrc else [] }}"

[[groups]]
id = "utilities"
title = "Raspberry Pi utilities"
description = "vcgencmd, pinctrl, eeprom and other tools."
default = true
when = "'stage4' in extra_stages or 'gnome' in extra_stages or 'plasma' in extra_stages"
stages = ["stage4", "stage4-gnome", "stage4-plasma"]
[groups.arguments]
stage4_packages = ["dev-embedded/raspberrypi-utils"]

[[groups]]
id = "development"
title = "Development tools"
description = "git, eselect-repository and kernel headers."
when = "'stage4' in extra_stages or 'gnome' in extra_stages or 'plasma' in extra_stages"
stages = ["stage4", "stage4-gnome", "stage4-plasma"]
[groups.arguments]
stage4_packages = ["dev-vcs/git", "app-eselect/eselect-repository", "sys-kernel/linux-headers"]

[[groups]]
id = "docker"
title = "Docker"
description = "Container engine, started at boot."
when = "'stage4' in extra_stages or 'gnome' in extra_stages or 'plasma' in extra_stages"
stages = ["stage4", "stage4-gnome", "stage4-plasma"]
[groups.arguments]
stage4_packages = ["app-containers/docker", "app-containers/docker-cli"]
stage4_rcadd = "{{ ['docker|default'] if openrc else [] }}"

# Installation ISO: Raspberry Pi device configuration in both stages and zram of live system.
[[files]]
source = "files/stage4/portage"
destination = "stages/{{ iso_stage1_name }}/portage"
when = "'iso' in extra_stages"

[[files]]
source = "files/stage4/portage"
destination = "stages/{{ iso_stage2_name }}/portage"
when = "'iso' in extra_stages"

[[files]]
source = "files/zram"
destination = "stages/{{ iso_stage2_name }}/root_overlay"
when = "'iso' in extra_stages and zram != 'off'"

# Live ISO with desktop: Raspberry Pi devices and desktop settings (and LTO workarounds) in both stages, live system
# setup (fsscript), Plasma display manager and zram.
[[files]]
source = "files/stage4/portage"
destination = "stages/{{ livegui_stage1_name }}/portage"
when = "'iso_gui' in extra_stages"

[[files]]
source = "files/desktop/portage"
destination = "stages/{{ livegui_stage1_name }}/portage"
when = "'iso_gui' in extra_stages"

[[files]]
source = "files/lto-workarounds"
destination = "stages/{{ livegui_stage1_name }}/portage"
when = "'iso_gui' in extra_stages and lto"

[[files]]
source = "files/lto-workarounds-tuned"
destination = "stages/{{ livegui_stage1_name }}/portage"
when = "'iso_gui' in extra_stages and lto and tuned"

[[files]]
source = "files/stage4/portage"
destination = "stages/{{ livegui_stage2_name }}/portage"
when = "'iso_gui' in extra_stages"

[[files]]
source = "files/desktop/portage"
destination = "stages/{{ livegui_stage2_name }}/portage"
when = "'iso_gui' in extra_stages"

[[files]]
source = "files/livegui/fsscript.sh"
destination = "stages/{{ livegui_stage2_name }}/fsscript.sh"
when = "'iso_gui' in extra_stages"

# Packages of live desktop only in testing branch on arm64 (eg. gparted).
[[files]]
source = "files/livegui-portage"
destination = "stages/{{ livegui_stage1_name }}/portage"
when = "'iso_gui' in extra_stages"

[[files]]
source = "files/livegui-portage"
destination = "stages/{{ livegui_stage2_name }}/portage"
when = "'iso_gui' in extra_stages"

[[files]]
source = "files/openrc-display-manager/root_overlay"
destination = "stages/{{ livegui_stage2_name }}/root_overlay"
when = "'iso_gui' in extra_stages and openrc"

[[files]]
source = "files/zram"
destination = "stages/{{ livegui_stage2_name }}/root_overlay"
when = "'iso_gui' in extra_stages and zram != 'off'"

[[files]]
source = "files/project.gitignore"
destination = ".gitignore"
